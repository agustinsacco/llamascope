[package]
name = "llamascope"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
authors = ["Agustin Sacco"]
description = "A terminal-native developer dashboard for inspecting and optimizing llama-server inference."
license = "MIT"
repository = "https://github.com/agustinsacco/llamascope"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
signal-hook = "0.3"
