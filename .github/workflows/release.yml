name: Release

# Push a tag that matches Cargo.toml, e.g. `git tag v1.1.0 && git push origin v1.1.0`.
# Publishes static Linux (musl) and macOS binaries, SHA256SUMS, and install.sh.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match Cargo.toml $version"; exit 1; }
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          target=${{ matrix.target }}
          echo "CC_${target//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - name: Test
        if: "!contains(matrix.target, 'x86_64-apple')"
        run: cargo test --locked --all-targets
      - name: Build
        run: |
          cargo build --locked --release --target ${{ matrix.target }}
          mkdir dist
          cp target/${{ matrix.target }}/release/llamascope dist/llamascope-${{ matrix.target }}
      - name: Smoke test the release binary
        if: "!contains(matrix.target, 'x86_64-apple')"
        run: |
          test "$(dist/llamascope-${{ matrix.target }} --version)" = "LlamaScope ${GITHUB_REF_NAME#v}"
          if [ "$RUNNER_OS" = Linux ]; then ! ldd dist/llamascope-${{ matrix.target }} 2>/dev/null | grep -q '=>'; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llamascope-${{ matrix.target }}
          path: dist/llamascope-${{ matrix.target }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cp install.sh dist/install.sh
          cd dist && sha256sum llamascope-* install.sh > SHA256SUMS && cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "LlamaScope ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
